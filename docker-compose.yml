services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-novabooks}
      POSTGRES_USER: novabooks_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-novabooks-admin-local-only}
      NOVABOOKS_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-novabooks-app-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - novabooks-postgres:/var/lib/postgresql/data
      - ./database/bootstrap/00-create-runtime-role.sh:/docker-entrypoint-initdb.d/00-create-runtime-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novabooks_admin -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["npm", "run", "db:migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://novabooks_admin:${POSTGRES_ADMIN_PASSWORD:-novabooks-admin-local-only}@postgres:5432/${DB_DATABASE:-novabooks}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://novabooks:${POSTGRES_APP_PASSWORD:-novabooks-app-local-only}@postgres:5432/${DB_DATABASE:-novabooks}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-12}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      TELEGRAM_BOT_API_BASE_URL: ${TELEGRAM_BOT_API_BASE_URL:-https://api.telegram.org}
      ZALO_API_BASE_URL: ${ZALO_API_BASE_URL:-https://openapi.zalo.me}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_VOICE_ID: ${TTS_VOICE_ID:-}
      DAILY_REPORT_CRON: ${DAILY_REPORT_CRON:-0 18 * * *}
    volumes:
      - novabooks-uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  novabooks-postgres:
  novabooks-uploads:
